name: Intelligence Dynamics GCP lifecycle control

on:
  push:
    branches:
      - intelligence-dynamics-gcp-control
    paths:
      - "control/intelligence-dynamics/config.json"
      - "control/intelligence-dynamics/desired.json"
      - ".github/workflows/intelligence-dynamics-gcp-control.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: intelligence-dynamics-gcp-control
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CONTROL_DIR: control/intelligence-dynamics
      INSTANCE_NAME: intelligence-dynamics-worker
      ID_GCP_PROJECT_ID: ${{ vars.ID_GCP_PROJECT_ID }}
      ID_GCP_WIF_PROVIDER: ${{ vars.ID_GCP_WIF_PROVIDER }}
      ID_GCP_SERVICE_ACCOUNT: ${{ vars.ID_GCP_SERVICE_ACCOUNT }}
      ID_GCP_ZONE: ${{ vars.ID_GCP_ZONE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intelligence-dynamics-gcp-control

      - name: Validate controller logic tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONTROL_DIR"
          python3 test_controller_logic.py
          python3 test_provider_plan.py

      - name: Validate fixed control request
        id: cfg
        shell: bash
        run: |
          set -euo pipefail
          python3 "$CONTROL_DIR/controller_logic.py" \
            --config "$CONTROL_DIR/config.json" \
            --desired "$CONTROL_DIR/desired.json" \
            --receipts "$CONTROL_DIR/receipts" \
            --github-output "$GITHUB_OUTPUT" \
            --project-id "$ID_GCP_PROJECT_ID" \
            --provider "$ID_GCP_WIF_PROVIDER" \
            --service-account "$ID_GCP_SERVICE_ACCOUNT" \
            --zone "$ID_GCP_ZONE"

      - name: Record unconfigured fail-closed state
        if: steps.cfg.outputs.configured != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt, json, os, pathlib
          d=pathlib.Path(os.environ["CONTROL_DIR"])/"receipts"
          d.mkdir(parents=True, exist_ok=True)
          p=d/(os.environ["GITHUB_RUN_ID"]+"-"+os.environ["GITHUB_RUN_ATTEMPT"]+".json")
          p.write_text(json.dumps({
            "schema_version":1,
            "controller":"github-actions-wif",
            "status":"NOT_CONFIGURED",
            "generation":int("${{ steps.cfg.outputs.generation }}"),
            "effective_desired_state":"TERMINATED",
            "provider_status":"UNKNOWN",
            "operation":"NONE",
            "at_utc":dt.datetime.now(dt.timezone.utc).isoformat(timespec="milliseconds"),
            "error":"WIF config not installed; no GCP operation attempted"
          },indent=2,sort_keys=True)+"\n")
          PY

      - name: Authenticate to Google Cloud through direct WIF
        if: steps.cfg.outputs.configured == 'true' && steps.cfg.outputs.service_account == ''
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ steps.cfg.outputs.project_id }}
          workload_identity_provider: ${{ steps.cfg.outputs.provider }}

      - name: Authenticate to Google Cloud through service-account WIF
        if: steps.cfg.outputs.configured == 'true' && steps.cfg.outputs.service_account != ''
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ steps.cfg.outputs.project_id }}
          workload_identity_provider: ${{ steps.cfg.outputs.provider }}
          service_account: ${{ steps.cfg.outputs.service_account }}

      - name: Set up gcloud
        if: steps.cfg.outputs.configured == 'true'
        uses: google-github-actions/setup-gcloud@v3

      - name: Reconcile provider state
        if: steps.cfg.outputs.configured == 'true'
        id: reconcile
        shell: bash
        env:
          PROJECT_ID: ${{ steps.cfg.outputs.project_id }}
          ZONE_HINT: ${{ steps.cfg.outputs.zone }}
          EFFECTIVE_STATE: ${{ steps.cfg.outputs.effective_state }}
          GENERATION: ${{ steps.cfg.outputs.generation }}
        run: |
          set -euo pipefail
          started_ms="$(date +%s%3N)"

          if [[ "$ZONE_HINT" == "AUTO" ]]; then
            mapfile -t matches < <(
              gcloud compute instances list                 --project "$PROJECT_ID"                 --filter="name=('$INSTANCE_NAME')"                 --format='value(zone.basename())'
            )
            if [[ "${#matches[@]}" -ne 1 || -z "${matches[0]}" ]]; then
              echo "expected exactly one instance named $INSTANCE_NAME; got ${#matches[@]}" >&2
              exit 40
            fi
            ZONE="${matches[0]}"
          else
            ZONE="$ZONE_HINT"
          fi

          status="$(gcloud compute instances describe "$INSTANCE_NAME"             --project "$PROJECT_ID" --zone "$ZONE" --format='value(status)')"

          plan_json="$(python3 "$CONTROL_DIR/provider_plan.py" \
            --effective-state "$EFFECTIVE_STATE" \
            --provider-status "$status")"
          provider_action="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["provider_action"])' <<<"$plan_json")"
          target="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["target_status"])' <<<"$plan_json")"
          operation="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["operation"])' <<<"$plan_json")"

          case "$provider_action" in
            start)
              gcloud compute instances start "$INSTANCE_NAME" \
                --project "$PROJECT_ID" --zone "$ZONE" --quiet
              operation="START_ACCEPTED"
              ;;
            stop)
              gcloud compute instances stop "$INSTANCE_NAME" \
                --project "$PROJECT_ID" --zone "$ZONE" --quiet
              if [[ "$EFFECTIVE_STATE" == "TERMINATED" ]]; then
                operation="STOP_ACCEPTED"
              fi
              ;;
            none)
              ;;
            *)
              echo "planner emitted unsupported action: $provider_action" >&2
              exit 42
              ;;
          esac

          deadline=$(( $(date +%s) + 90 ))
          final="$status"
          while (( $(date +%s) <= deadline )); do
            final="$(gcloud compute instances describe "$INSTANCE_NAME"               --project "$PROJECT_ID" --zone "$ZONE" --format='value(status)')"
            [[ "$final" == "$target" ]] && break
            sleep 3
          done

          verified=false
          [[ "$final" == "$target" ]] && verified=true
          elapsed_ms=$(( $(date +%s%3N) - started_ms ))

          python3 - <<PY
          import datetime as dt, json, os, pathlib
          d=pathlib.Path(os.environ["CONTROL_DIR"])/"receipts"
          d.mkdir(parents=True, exist_ok=True)
          p=d/(os.environ["GITHUB_RUN_ID"]+"-"+os.environ["GITHUB_RUN_ATTEMPT"]+".json")
          p.write_text(json.dumps({
            "schema_version":1,
            "controller":"github-actions-wif",
            "status":"VERIFIED" if "$verified" == "true" else "TIMEOUT",
            "generation":int(os.environ["GENERATION"]),
            "effective_desired_state":os.environ["EFFECTIVE_STATE"],
            "provider_status":"$final",
            "project_id":"REDACTED",
            "zone":"REDACTED",
            "instance_name":os.environ["INSTANCE_NAME"],
            "operation":"$operation",
            "provider_verified":("$verified" == "true"),
            "elapsed_ms":int("$elapsed_ms"),
            "at_utc":dt.datetime.now(dt.timezone.utc).isoformat(timespec="milliseconds"),
            "error":"" if "$verified" == "true" else "provider state did not converge within 90s"
          },indent=2,sort_keys=True)+"\n")
          PY

          if [[ "$verified" != "true" ]]; then
            exit 41
          fi

      - name: Commit compact receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Intelligence Dynamics GCP Controller"
          git config user.email "gcp-controller@intelligence-dynamics.invalid"
          git add "$CONTROL_DIR/receipts/"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record Intelligence Dynamics GCP control receipt"

          # Receipt files are run-unique. Rebase onto control updates before push
          # so a concurrent desired/config commit cannot cause a non-fast-forward
          # loss of evidence.
          pushed=false
          for attempt in 1 2 3; do
            git fetch origin intelligence-dynamics-gcp-control
            git rebase origin/intelligence-dynamics-gcp-control
            if git push origin HEAD:intelligence-dynamics-gcp-control; then
              pushed=true
              break
            fi
            sleep "$(( attempt * 2 ))"
          done
          [[ "$pushed" == "true" ]]
